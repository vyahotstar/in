<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VyaHotstar Shorts</title>
<link rel="icon" href="VYA NEW.png">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080910;
  color: #fff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  height: 65px;
  padding: 0 25px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #10111b;
  border-bottom: 1px solid #242534;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #00e5ff;
}

.logo span {
  color: #ff277e;
}

.header-link {
  color: white;
  text-decoration: none;
  background: #242637;
  padding: 10px 16px;
  border-radius: 20px;
}

.page-layout {
  display: grid;
  grid-template-columns: 1fr 390px;
  gap: 25px;
  max-width: 1250px;
  margin: 0 auto;
  padding: 25px;
}

.main-content {
  padding: 20px 5px;
}

.main-content h1 {
  font-size: 36px;
  margin-bottom: 12px;
}

.main-content p {
  color: #a8aabb;
  line-height: 1.7;
}

.shorts-sidebar {
  width: 100%;
}

.shorts-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.shorts-heading h2 {
  font-size: 21px;
}

.shuffle-button {
  border: 0;
  border-radius: 20px;
  padding: 9px 13px;
  color: white;
  background: #292b3b;
  cursor: pointer;
}

.shuffle-button:hover {
  background: #41445a;
}

.shorts-list {
  height: calc(100vh - 125px);
  min-height: 480px;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  border-radius: 18px;
  scrollbar-width: thin;
  scrollbar-color: #41445a #11121c;
}

.short-card {
  position: relative;
  height: calc(100vh - 125px);
  min-height: 480px;
  max-height: 850px;
  margin-bottom: 14px;
  background: #141520;
  border: 1px solid #292b3b;
  border-radius: 18px;
  overflow: hidden;
  scroll-snap-align: start;
}

.video-frame {
  position: absolute;
  inset: 0;
  background: #000;
}

.player-slot,
.player-slot iframe,
.player-slot video {
  width: 100%;
  height: 100%;
  display: block;
  border: 0;
}

.player-slot iframe {
  position: absolute;
  inset: 0;
}

.video-placeholder {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: #aaa;
  font-size: 14px;
  background: #10111b;
  pointer-events: none;
}

.side-actions {
  position: absolute;
  z-index: 5;
  right: 12px;
  bottom: 25px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.action-button {
  border: none;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(22, 24, 39, 0.88);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 23px;
  cursor: pointer;
  box-shadow: 0 3px 14px #0007;
  transition: transform .2s, background .2s;
}

.action-button:hover {
  transform: scale(1.1);
  background: #33364d;
}

.action-button.liked {
  color: #ff3c78;
  background: #351727;
}

.action-count {
  color: white;
  font-size: 11px;
  text-align: center;
  margin-top: -13px;
  text-shadow: 0 1px 4px black;
}

.bottom-controls {
  position: absolute;
  z-index: 4;
  bottom: 15px;
  left: 12px;
  display: flex;
  gap: 9px;
}

.small-control {
  padding: 10px 13px;
  border: 1px solid #ffffff30;
  border-radius: 22px;
  background: #11131cce;
  color: white;
  cursor: pointer;
}

.small-control:hover {
  background: #34374b;
}

.short-number {
  position: absolute;
  top: 13px;
  left: 13px;
  z-index: 4;
  padding: 7px 11px;
  background: #11131cce;
  border-radius: 20px;
  font-size: 12px;
}

.empty-message {
  padding: 30px;
  text-align: center;
  color: #aaa;
}

/* Responsive design */
@media (max-width: 850px) {
  .page-layout {
    display: block;
    padding: 15px;
  }

  .main-content {
    display: none;
  }

  .shorts-sidebar {
    max-width: 430px;
    margin: 0 auto;
  }

  .shorts-list {
    height: calc(100dvh - 115px);
    min-height: 450px;
  }

  .short-card {
    height: calc(100dvh - 115px);
    min-height: 450px;
  }

  header {
    height: 55px;
  }
}

@media (max-width: 480px) {
  .page-layout {
    padding: 8px;
  }

  .shorts-list,
  .short-card {
    height: calc(100dvh - 95px);
    min-height: 400px;
  }

  .short-card {
    border-radius: 14px;
  }

  .side-actions {
    right: 8px;
    gap: 16px;
  }

  .action-button {
    width: 43px;
    height: 43px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">VyaHotstar.github.io</span></div>
  <a class="header-link" href="index.html">BACK</a>
</header>

<div class="page-layout">

  <main class="main-content">
    <h1>Shorts</h1>
    <p>
     Powered by YouTube
    </p>
  </main>

  <aside class="shorts-sidebar">
    <div class="shorts-heading">
      <h2>Short Videos</h2>
      <button class="shuffle-button" id="shuffleButton">
        ↻ Shuffle
      </button>
    </div>

    <div class="shorts-list" id="shortsList">
      <div class="empty-message">Loading videos...</div>
    </div>
  </aside>

</div>

<script>
const videoIds = [
  "gkHKxnaPSC0",
  "3NxmfLkBd1E",
  "gPceQU6wrQw",
  "gFFCLwGOUqs",
  "BqyQ6koskeQ",
  "_8aCcRdCGuk",
  "zewR5bkSPpo",
  "S_TxJxp9d78",
  "b7ewsPK2B9U",
  "ZFgQ5jYwvfI",
  "Y2yoA5v4160",
  "sQeOtxpw-uE",
  "xe0ze83fKfA",
  "TqeWNmzOgv8",
  "aJbKees5_gs",
  "f1hwxLv_G2A"
];

const shortsList = document.getElementById("shortsList");
const shuffleButton = document.getElementById("shuffleButton");

let players = {};
let activeCard = null;
let apiReady = false;
let observer = null;

function shuffleArray(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function createCards() {
  shortsList.innerHTML = "";
  players = {};

  const shuffledVideos = shuffleArray(videoIds);

  shuffledVideos.forEach((videoId, index) => {
    const card = document.createElement("article");
    card.className = "short-card";
    card.dataset.videoId = videoId;

    card.innerHTML = `
      <div class="video-frame">
        <div class="player-slot" id="player-${videoId}">
          <div class="video-placeholder">Loading video...</div>
        </div>
      </div>

      <div class="short-number">${index + 1} / ${shuffledVideos.length}</div>

      <div class="side-actions">
        <button class="action-button like-button"
                aria-label="Like video"
                title="Like">♥</button>
        <div class="action-count like-count">0 likes</div>

        <button class="action-button share-button"
                aria-label="Share video"
                title="Share">↗</button>
        <div class="action-count">Share</div>

        <button class="action-button copy-button"
                aria-label="Copy video link"
                title="Copy link">🔗</button>
        <div class="action-count">Copy link</div>
      </div>

      <div class="bottom-controls">
        <button class="small-control mute-button">🔇 Sound</button>
        <button class="small-control open-button">↗ Open video</button>
      </div>
    `;

    shortsList.appendChild(card);

    card.querySelector(".like-button").addEventListener("click", event => {
      const button = event.currentTarget;
      const count = card.querySelector(".like-count");
      const liked = button.classList.toggle("liked");

      button.textContent = liked ? "♥" : "♡";
      count.textContent = liked ? "1 like" : "0 likes";
    });

    card.querySelector(".share-button").addEventListener("click", async () => {
      const url = `https://www.youtube.com/shorts/${videoId}`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: "Watch this short video",
            url
          });
        } catch (error) {
          // The user may cancel the share dialog.
        }
      } else {
        copyText(url);
      }
    });

    card.querySelector(".copy-button").addEventListener("click", () => {
      copyText(`https://www.youtube.com/shorts/${videoId}`);
    });

    card.querySelector(".open-button").addEventListener("click", () => {
      window.open(
        `https://www.youtube.com/shorts/${videoId}`,
        "_blank",
        "noopener,noreferrer"
      );
    });

    card.querySelector(".mute-button").addEventListener("click", () => {
      const player = players[videoId];
      if (!player || typeof player.isMuted !== "function") return;

      if (player.isMuted()) {
        player.unMute();
        player.setVolume(100);
        card.querySelector(".mute-button").textContent = "🔊 Sound";
      } else {
        player.mute();
        card.querySelector(".mute-button").textContent = "🔇 Sound";
      }
    });
  });

  setupObserver();

  if (apiReady) {
    initializeVisiblePlayers();
  }
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    alert("Video link copied!");
  } catch (error) {
    window.prompt("Copy this video link:", text);
  }
}

function setupObserver() {
  if (observer) observer.disconnect();

  observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const card = entry.target;
      const videoId = card.dataset.videoId;

      if (entry.isIntersecting && entry.intersectionRatio >= 0.65) {
        activeCard = card;

        if (apiReady) {
          createPlayerIfNeeded(videoId);
        }

        Object.entries(players).forEach(([id, player]) => {
          if (id !== videoId && player && player.pauseVideo) {
            try {
              player.pauseVideo();
            } catch (error) {}
          }
        });

        const currentPlayer = players[videoId];

        if (currentPlayer && currentPlayer.playVideo) {
          try {
            currentPlayer.playVideo();
          } catch (error) {}
        }
      } else if (players[videoId] && players[videoId].pauseVideo) {
        try {
          players[videoId].pauseVideo();
        } catch (error) {}
      }
    });
  }, {
    root: shortsList,
    threshold: [0.25, 0.65, 0.9]
  });

  document.querySelectorAll(".short-card").forEach(card => {
    observer.observe(card);
  });
}

function initializeVisiblePlayers() {
  const cards = document.querySelectorAll(".short-card");

  cards.forEach(card => {
    const rect = card.getBoundingClientRect();
    const listRect = shortsList.getBoundingClientRect();

    if (rect.bottom > listRect.top && rect.top < listRect.bottom) {
      createPlayerIfNeeded(card.dataset.videoId);
    }
  });
}

function createPlayerIfNeeded(videoId) {
  if (!apiReady || players[videoId]) return;

  const container = document.getElementById(`player-${videoId}`);
  if (!container) return;

  container.innerHTML = "";

  const player = new YT.Player(container, {
    videoId,
    playerVars: {
      autoplay: 1,
      controls: 1,
      playsinline: 1,
      rel: 0,
      enablejsapi: 1,
      origin: window.location.origin
    },
    events: {
      onReady: event => {
        event.target.mute();

        if (activeCard &&
            activeCard.dataset.videoId === videoId) {
          event.target.playVideo();
        }
      },
      onError: () => {
        container.innerHTML =
          '<div class="video-placeholder">This video cannot be embedded. Use Open video to watch it.</div>';
      }
    }
  });

  players[videoId] = player;
}

window.onYouTubeIframeAPIReady = function() {
  apiReady = true;
  initializeVisiblePlayers();
};

const youtubeScript = document.createElement("script");
youtubeScript.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(youtubeScript);

shuffleButton.addEventListener("click", () => {
  createCards();
});

createCards();
</script>

</body>
</html>
