<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VyaHotstar - Shorts Player</title>
  <meta name="description" content="Watch videos on VyaHotstar.">

  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://www.google.com">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080a12;
      color: #fff;
      min-height: 100vh;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      height: 70px;
      padding: 0 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #10131e;
      border-bottom: 1px solid #252938;
    }

    .brand {
      color: #fff;
      font-size: 25px;
      font-weight: 800;
      text-decoration: none;
    }

    .brand span {
      color: #00d5ff;
    }

    .back-link {
      text-decoration: none;
      color: #fff;
      padding: 10px 15px;
      background: #252a39;
      border-radius: 8px;
      font-size: 14px;
    }

    .back-link:hover {
      background: #353c50;
    }

    main {
      max-width: 1150px;
      margin: 25px auto;
      padding: 0 18px;
    }

    .video-title {
      margin-bottom: 16px;
      font-size: 23px;
    }

    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
      border-radius: 14px;
      border: 1px solid #282c38;
      box-shadow: 0 15px 45px #0008;
    }

    #youtube-player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #youtube-player iframe {
      width: 100%;
      height: 100%;
    }

    .player-message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #000;
      color: #ccc;
      text-align: center;
      pointer-events: none;
      z-index: 1;
    }

    .player-message.hidden {
      display: none;
    }

    .controls {
      position: absolute;
      z-index: 3;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 40px 18px 16px;
      background: linear-gradient(transparent, #000e);
      transition: opacity .25s;
    }

    .controls.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .time {
      font-size: 12px;
      white-space: nowrap;
      color: #eee;
    }

    #progress {
      flex: 1;
      width: 100%;
      accent-color: #00d5ff;
      cursor: pointer;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 17px;
    }

    .control-button {
      border: none;
      background: transparent;
      color: white;
      font-size: 19px;
      padding: 5px;
    }

    .control-button:hover {
      color: #00d5ff;
    }

    .volume {
      width: 90px;
      accent-color: #00d5ff;
    }

    .spacer {
      flex: 1;
    }

    .status {
      margin-top: 15px;
      color: #b7bdcc;
      font-size: 14px;
      line-height: 1.6;
    }

    .status strong {
      color: #00d5ff;
    }

    .shortcuts {
      margin-top: 22px;
      padding: 18px;
      border-radius: 10px;
      background: #111521;
      color: #b8bfd0;
      font-size: 13px;
      line-height: 2;
    }

    .shortcuts h3 {
      color: #fff;
      margin-bottom: 5px;
    }

    kbd {
      padding: 3px 7px;
      background: #292f40;
      border-radius: 4px;
      color: #fff;
    }

    @media (max-width: 600px) {
      .topbar {
        height: 60px;
        padding: 0 14px;
      }

      .brand {
        font-size: 21px;
      }

      main {
        margin: 18px auto;
        padding: 0 10px;
      }

      .player {
        border-radius: 8px;
      }

      .controls {
        padding: 28px 9px 8px;
      }

      .control-row {
        gap: 9px;
      }

      .control-button {
        font-size: 16px;
      }

      .volume {
        width: 55px;
      }

      .video-title {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a class="brand" href="index.html">Vya<span>Hotstar</span></a>
    <a class="back-link" href="index.html">
      <i class="fa-solid fa-arrow-left"></i> Back
    </a>
  </header>

  <main>
    <h1 class="video-title" id="video-title">Shorts</h1>

    <section class="player" id="player-container">

      <div id="youtube-player"></div>

      <div class="player-message" id="player-message">
        Loading video player...
      </div>

      <div class="controls" id="controls">

        <div class="progress-row">
          <span class="time" id="current-time">0:00</span>

          <input
            type="range"
            id="progress"
            min="0"
            max="100"
            value="0"
            step="0.1"
            aria-label="Video progress"
          >

          <span class="time" id="duration">0:00</span>
        </div>

        <div class="control-row">
          <button class="control-button" id="play-button"
                  title="Play or pause" aria-label="Play or pause">
            <i class="fa-solid fa-play"></i>
          </button>

          <button class="control-button" id="backward-button"
                  title="Back 10 seconds" aria-label="Back 10 seconds">
            <i class="fa-solid fa-backward"></i>
          </button>

          <button class="control-button" id="forward-button"
                  title="Forward 10 seconds" aria-label="Forward 10 seconds">
            <i class="fa-solid fa-forward"></i>
          </button>

          <button class="control-button" id="mute-button"
                  title="Mute or unmute" aria-label="Mute or unmute">
            <i class="fa-solid fa-volume-high"></i>
          </button>

          <input
            class="volume"
            type="range"
            id="volume"
            min="0"
            max="100"
            value="100"
            aria-label="Volume"
          >

          <div class="spacer"></div>

          <button class="control-button" id="fullscreen-button"
                  title="Fullscreen" aria-label="Fullscreen">
            <i class="fa-solid fa-expand"></i>
          </button>
        </div>
      </div>
    </section>

    <p class="status" id="status">
      Player status: <strong>Connecting...</strong>
    </p>

    <section class="shortcuts">
      <h3>Keyboard shortcuts</h3>
      <p><kbd>Space</kbd> Play or pause</p>
      <p><kbd>←</kbd> Rewind 10 seconds</p>
      <p><kbd>→</kbd> Forward 10 seconds</p>
      <p><kbd>M</kbd> Mute or unmute</p>
      <p><kbd>F</kbd> Fullscreen</p>
    </section>
  </main>

  <script>
    // Read video ID and title from the URL.
    const params = new URLSearchParams(window.location.search);

    const VIDEO_ID = params.get("video") || "wywdypqgNd8";
    const TITLE = params.get("title") || "Shorts";

    document.title = "VyaHotstar - " + TITLE;
    document.getElementById("video-title").textContent = TITLE;

    const playerContainer = document.getElementById("player-container");
    const message = document.getElementById("player-message");
    const controls = document.getElementById("controls");
    const playButton = document.getElementById("play-button");
    const muteButton = document.getElementById("mute-button");
    const progress = document.getElementById("progress");
    const volume = document.getElementById("volume");
    const currentTime = document.getElementById("current-time");
    const duration = document.getElementById("duration");
    const status = document.getElementById("status");

    let player;
    let progressTimer = null;
    let hideControlsTimer = null;
    let seeking = false;

    function setStatus(text) {
      status.innerHTML = "Player status: ";
      const strong = document.createElement("strong");
      strong.textContent = text;
      status.appendChild(strong);
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) {
        return "0:00";
      }

      const total = Math.floor(seconds);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;

      if (hours > 0) {
        return hours + ":" +
          String(minutes).padStart(2, "0") + ":" +
          String(secs).padStart(2, "0");
      }

      return minutes + ":" + String(secs).padStart(2, "0");
    }

    function updatePlayButton() {
      if (!player || typeof player.getPlayerState !== "function") {
        return;
      }

      const playing = player.getPlayerState() === YT.PlayerState.PLAYING;

      playButton.innerHTML = playing
        ? '<i class="fa-solid fa-pause"></i>'
        : '<i class="fa-solid fa-play"></i>';
    }

    function updateMuteButton() {
      if (!player || typeof player.isMuted !== "function") {
        return;
      }

      const muted = player.isMuted() || player.getVolume() === 0;

      muteButton.innerHTML = muted
        ? '<i class="fa-solid fa-volume-xmark"></i>'
        : '<i class="fa-solid fa-volume-high"></i>';
    }

    function updateProgress() {
      if (!player || typeof player.getDuration !== "function") {
        return;
      }

      const total = player.getDuration();
      const elapsed = player.getCurrentTime();

      if (!seeking) {
        progress.value = total > 0 ? (elapsed / total) * 100 : 0;
      }

      currentTime.textContent = formatTime(elapsed);
      duration.textContent = formatTime(total);
      updatePlayButton();
      updateMuteButton();
    }

    function togglePlay() {
      if (!player || typeof player.getPlayerState !== "function") {
        return;
      }

      if (player.getPlayerState() === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function seekBy(seconds) {
      if (!player || typeof player.getCurrentTime !== "function") {
        return;
      }

      const total = player.getDuration();
      const target = Math.max(
        0,
        Math.min(total || Infinity, player.getCurrentTime() + seconds)
      );

      player.seekTo(target, true);
    }

    function toggleMute() {
      if (!player) return;

      if (player.isMuted()) {
        player.unMute();
        player.setVolume(Number(volume.value));
      } else {
        player.mute();
      }

      updateMuteButton();
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await playerContainer.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        setStatus("Fullscreen is unavailable in this browser.");
      }
    }

    function showControls() {
      controls.classList.remove("hidden");
      clearTimeout(hideControlsTimer);

      if (player &&
          player.getPlayerState &&
          player.getPlayerState() === YT.PlayerState.PLAYING) {
        hideControlsTimer = setTimeout(() => {
          controls.classList.add("hidden");
        }, 3000);
      }
    }

    playerContainer.addEventListener("mousemove", showControls);
    playerContainer.addEventListener("touchstart", showControls, {
      passive: true
    });

    playButton.addEventListener("click", togglePlay);

    document.getElementById("backward-button").addEventListener(
      "click", () => seekBy(-10)
    );

    document.getElementById("forward-button").addEventListener(
      "click", () => seekBy(10)
    );

    muteButton.addEventListener("click", toggleMute);

    volume.addEventListener("input", () => {
      if (!player) return;

      player.setVolume(Number(volume.value));

      if (Number(volume.value) === 0) {
        player.mute();
      } else {
        player.unMute();
      }

      updateMuteButton();
    });

    progress.addEventListener("input", () => {
      seeking = true;

      if (player && player.getDuration() > 0) {
        const target = player.getDuration() *
          Number(progress.value) / 100;

        currentTime.textContent = formatTime(target);
      }
    });

    function finishSeek() {
      if (!seeking || !player) return;

      const total = player.getDuration();

      if (total > 0) {
        player.seekTo(total * Number(progress.value) / 100, true);
      }

      seeking = false;
      updateProgress();
    }

    progress.addEventListener("change", finishSeek);
    progress.addEventListener("pointerup", finishSeek);
    document.getElementById("fullscreen-button").addEventListener(
      "click", toggleFullscreen
    );

    document.addEventListener("keydown", event => {
      const tag = event.target.tagName;

      if (["INPUT", "TEXTAREA", "SELECT"].includes(tag)) return;

      switch (event.key.toLowerCase()) {
        case " ":
          event.preventDefault();
          togglePlay();
          break;

        case "arrowleft":
          event.preventDefault();
          seekBy(-10);
          break;

        case "arrowright":
          event.preventDefault();
          seekBy(10);
          break;

        case "m":
          toggleMute();
          break;

        case "f":
          toggleFullscreen();
          break;
      }
    });

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("youtube-player", {
        videoId: VIDEO_ID,

        playerVars: {
          autoplay: 0,
          controls: 0,
          playsinline: 1,
          rel: 0
        },

        events: {
          onReady: event => {
            message.classList.add("hidden");
            setStatus("Ready to play");

            event.target.setVolume(Number(volume.value));

            progressTimer = setInterval(updateProgress, 500);
            updateProgress();
          },

          onStateChange: event => {
            updatePlayButton();

            if (event.data === YT.PlayerState.PLAYING) {
              setStatus("Playing");
              message.classList.add("hidden");
              showControls();
            } else if (event.data === YT.PlayerState.PAUSED) {
              setStatus("Paused");
              showControls();
            } else if (event.data === YT.PlayerState.ENDED) {
              setStatus("Video ended");
              showControls();
            } else if (event.data === YT.PlayerState.BUFFERING) {
              setStatus("Buffering...");
            }
          },

          onError: event => {
            message.classList.remove("hidden");
            message.textContent =
              "This video cannot be played here. It may be private, " +
              "unavailable, or have embedding disabled. Error code: " +
              event.data;

            setStatus("Video unavailable");
          }
        }
      });
    }

    // Load the official YouTube IFrame Player API.
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    const youtubeScript = document.createElement("script");
    youtubeScript.src = "https://www.youtube.com/iframe_api";
    youtubeScript.async = true;
    document.head.appendChild(youtubeScript);

    window.addEventListener("beforeunload", () => {
      if (progressTimer) clearInterval(progressTimer);
      if (hideControlsTimer) clearTimeout(hideControlsTimer);
    });
  </script>

</body>
</html>
